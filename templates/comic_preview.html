<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Comic Preview - ComicCraft</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Bangers&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
    body { background: #0b0f19; color: #f8fafc; padding: 2rem 1rem; }
    .container { max-width: 900px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 2.5rem; }
    .header h1 { font-family: 'Bangers', cursive; font-size: 3rem; letter-spacing: 2px; color: #fbbf24; }
    .actions { display: flex; justify-content: center; gap: 1rem; margin-top: 1rem; }
    .btn {
      padding: 0.8rem 1.8rem; border-radius: 12px; font-weight: 700;
      text-decoration: none; display: inline-block; cursor: pointer;
    }
    .btn-primary { background: #4f46e5; color: white; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .panels-grid { display: flex; flex-direction: column; gap: 2.5rem; }
    .panel-card {
      background: #1e293b; border-radius: 18px; overflow: hidden;
      border: 2px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .panel-header { padding: 1rem 1.5rem; background: #0f172a; border-bottom: 1px solid #334155; font-size: 1.2rem; font-weight: 700; color: #a5b4fc; }
    .panel-body { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; padding: 1.5rem; }
    @media(max-width: 768px) { .panel-body { grid-template-columns: 1fr; } }
    .panel-img { width: 100%; border-radius: 12px; border: 2px solid #475569; max-height: 380px; object-fit: cover; }
    .panel-text { display: flex; flex-direction: column; justify-content: center; }
    .scene-desc { font-style: italic; color: #94a3b8; margin-bottom: 1rem; font-size: 0.9rem; line-height: 1.4; }
    .story-content { white-space: pre-wrap; font-size: 1rem; line-height: 1.6; color: #e2e8f0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Your AI Comic Preview</h1>
      <div class="actions">
        <a href="{{ pdf_path }}" download class="btn btn-primary" onclick="setTimeout(()=>{ window.location.href='/export-success?pdf_path={{ pdf_path }}'; }, 800);">Download as PDF</a>
        <a href="/" class="btn btn-secondary">Create Another</a>
      </div>
    </div>

    <div class="panels-grid">
      {% for panel in layout %}
      <div class="panel-card">
        <div class="panel-header">Panel {{ panel.panel }}: {{ panel.title }}</div>
        <div class="panel-body">
          <img src="{{ panel.image_path }}" class="panel-img" alt="Comic Panel Image">
          <div class="panel-text">
            <div class="scene-desc">Scene Context: {{ panel.scene_description }}</div>
            <div class="story-content">{{ panel.text }}</div>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
